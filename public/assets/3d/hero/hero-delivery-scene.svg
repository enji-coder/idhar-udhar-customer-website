<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" fill="none">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0E8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#314056"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC2A4"/>
      <stop offset="55%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#E4572E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4FBFC"/>
      <stop offset="100%" stop-color="#7ED7E2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="10" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
    <style>
      .route { stroke-dasharray: 640; stroke-dashoffset: 640; animation: draw 2.2s ease forwards; }
      .parcel { animation: bob 5s ease-in-out infinite; }
      .van { animation: glide 14s ease-in-out infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes bob { 50% { transform: translateY(-8px); } }
      @keyframes glide { 50% { transform: translate(18px, -6px); } }
      @media (prefers-reduced-motion: reduce) {
        .route, .parcel, .van { animation: none; }
        .route { stroke-dashoffset: 0; }
      }
    </style>
  </defs>
  <g filter="url(#soft)" opacity="0.95">
