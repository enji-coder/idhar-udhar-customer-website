    <polygon points="700,230 738,250 738,348 700,328" fill="#F7FBFF"/>
    <polygon points="738,250 798,224 798,322 738,348" fill="#E5EDF5"/>
  </g>
  <path d="M70 470 C 210 420, 300 530, 470 470 S 700 400, 820 460" stroke="#E6EDF3" stroke-width="34" stroke-linecap="round"/>
  <path class="route" d="M90 462 C 220 418, 310 520, 470 464 S 700 408, 800 452" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  <g>
