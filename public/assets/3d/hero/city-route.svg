<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" fill="none">
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7EEF5"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7EEF5"/>
    </linearGradient>
    <style>
      .route { stroke-dasharray: 720; stroke-dashoffset: 720; animation: draw 2s ease forwards; }
      .mover { animation: glide 12s ease-in-out infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes glide { 50% { transform: translate(26px, -10px); } }
      @media (prefers-reduced-motion: reduce) {
        .route, .mover { animation: none; }
        .route { stroke-dashoffset: 0; }
      }
    </style>
  </defs>
  <g opacity="0.55" stroke="#D5DEE8" stroke-width="1.2">
    <path d="M40 80 H820 M40 160 H820 M40 240 H820 M40 320 H820 M40 400 H820"/>
    <path d="M120 30 V490 M240 30 V490 M360 30 V490 M480 30 V490 M600 30 V490 M720 30 V490"/>
  </g>
  <path d="M60 360 C 180 250, 280 390, 420 300 S 680 180, 820 230" stroke="url(#road)" stroke-width="28" stroke-linecap="round"/>
  <path class="route" d="M80 348 C 190 260, 290 380, 430 292 S 690 190, 800 236" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="348" r="8" fill="#18B6C9"/>
  <circle cx="800" cy="236" r="8" fill="#FF6B35"/>
  <g class="mover">
    <rect x="400" y="268" width="36" height="16" rx="4" fill="#111827"/>
    <rect x="404" y="271" width="18" height="3" fill="#FF6B35"/>
  </g>
</svg>
